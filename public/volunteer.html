<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header"><nav class="nav container">
    <a href="/index.html">Home</a><a href="/volunteer.html">Volunteer</a><a href="/residents.html">Residents</a>
  </nav></header>
  <main class="container">
    <section class="panel">
      <h1 class="h1">Volunteer Dashboard</h1>
      <div class="grid cols-2">
        <input class="input" id="volunteerId" placeholder="Your Volunteer User ID" />
        <button class="btn" id="loadVisits">Load My Visits</button>
      </div>
    </section>

    <section class="panel" style="margin-top:12px">
      <h2 class="h1">Schedule Visit</h2>
      <div class="grid cols-2">
        <div class="grid" style="gap:8px">
          <input class="input" id="residentId" placeholder="Resident ID" />
          <button class="btn" id="pickResident">Pick Resident</button>
        </div>
        <input class="input" id="volIdForSchedule" placeholder="Volunteer ID" />
        <input class="input" id="visitDate" type="datetime-local" />
        <input class="input" id="visitNotes" placeholder="Notes" />
        <button class="btn primary" id="scheduleBtn">Schedule</button>
      </div>
      <div id="residentPicker" class="h2" style="margin-top:10px"></div>
    </section>

    <section class="panel" style="margin-top:12px">
      <h2 class="h1">My Visits</h2>
      <table class="table" id="visitTable">
        <thead><tr><th>Date</th><th>Resident</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    // Auto-fill volunteer ID from saved login
    (function prefillVolunteer(){
      try{
        const u = JSON.parse(localStorage.getItem('currentUser')||'null');
        if(u && u._id){
          $('#volunteerId').value = u._id;
          $('#volIdForSchedule').value = u._id;
        }
      }catch{}
    })();

    async function loadMyVisits(){
      const volId = $('#volunteerId').value.trim();
      if(!volId) return toast('Enter your volunteer user ID');
      const list = await api('/api/visits?volunteer='+encodeURIComponent(volId));
      const tbody = $('#visitTable tbody');
      tbody.innerHTML = '';
      list.forEach(v => {
        const tr = document.createElement('tr');
        const d = new Date(v.visitDate);
        tr.innerHTML = `<td>${d.toLocaleString()}</td><td>${v.resident?.name||''}</td><td>${v.status}</td><td>${v.notes||''}</td>
          <td>
            <button class='btn' data-done='${v._id}'>Mark Done</button>
            <button class='btn danger' data-del='${v._id}'>Cancel</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    $('#loadVisits').addEventListener('click', loadMyVisits);

    $('#scheduleBtn').addEventListener('click', async ()=>{
      try{
        const dt = $('#visitDate').value ? new Date($('#visitDate').value).toISOString() : null;
        const payload = { resident: $('#residentId').value.trim(), volunteer: $('#volIdForSchedule').value.trim(), visitDate: dt, notes: $('#visitNotes').value };
        await api('/api/visits', { method:'POST', body: JSON.stringify(payload)});
        toast('Visit scheduled');
        loadMyVisits();
      }catch(e){ toast('Schedule failed: '+e.message); }
    });

    // Pick resident helper: fetch and list residents to click-to-fill
    $('#pickResident').addEventListener('click', async ()=>{
      try{
        const list = await api('/api/residents');
        if(!list.length){ $('#residentPicker').textContent = 'No residents found. Add one on Residents page.'; return; }
        const wrap = document.createElement('div');
        wrap.className = 'grid';
        wrap.style.gridTemplateColumns = 'repeat(3,minmax(0,1fr))';
        wrap.style.gap = '8px';
        list.slice(0,9).forEach(r=>{
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<strong>${r.name}</strong><br><span class='h2'>${r.roomNumber||''}</span><br><small>${r._id}</small>`;
          card.style.cursor = 'pointer';
          card.addEventListener('click', ()=>{ $('#residentId').value = r._id; toast('Resident selected'); });
          wrap.appendChild(card);
        });
        const picker = $('#residentPicker');
        picker.innerHTML = '';
        picker.appendChild(wrap);
      }catch(err){ toast('Failed to load residents: '+err.message); }
    });

    $('#visitTable').addEventListener('click', async (e)=>{
      const doneId = e.target.getAttribute('data-done');
      const delId = e.target.getAttribute('data-del');
      if(doneId){
        try{ await api('/api/visits/'+doneId, { method:'PUT', body: JSON.stringify({ status:'completed' })}); toast('Marked completed'); loadMyVisits(); }catch(err){ toast('Update failed: '+err.message); }
      } else if(delId){
        if(confirm('Cancel this visit?')){
          try{ await api('/api/visits/'+delId, { method:'DELETE' }); toast('Cancelled'); loadMyVisits(); }catch(err){ toast('Delete failed: '+err.message); }
        }
      }
    });
  </script>
</body>
</html>
