<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Volunteer Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <nav class="nav between container">
      <div class="nav-left">
        <img class="logo" src="/careconnectlogo.png" alt="CareConnect" />
        <a href="/index.html">Home</a>
        <a href="/admin.html">Admin Dashboard</a>
        <a href="/residents.html">Resident Management</a>
        <a href="/volunteer.html">Volunteer Dashboard</a>
        <a href="/donations.html">Donations</a>
      </div>
      <div class="user-dropdown">
        <a class="user-btn" href="#" id="userBtn" title="Account">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </a>
        <div class="menu" id="userMenu">
          <a href="/login.html">Login</a>
          <a href="/register.html">Register</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    <section class="panel">
      <h1 class="h1">Volunteer Dashboard</h1>
      <div class="grid cols-2">
        <input class="input" id="volunteerId" placeholder="Your Volunteer User ID" />
        <button class="btn" id="loadVisits">Load My Visits</button>
      </div>
    </section>

    <section class="panel" style="margin-top:12px">
      <h2 class="h1">Schedule Visit</h2>
      <div class="grid cols-2">
        <div class="grid" style="gap:8px">
          <input class="input" id="residentId" placeholder="Resident ID" />
          <button class="btn" id="pickResident">Pick Resident</button>
        </div>
        <input class="input" id="volIdForSchedule" placeholder="Volunteer ID" />
        <input class="input" id="visitDate" type="datetime-local" />
        <input class="input" id="visitNotes" placeholder="Notes" />
        <button class="btn primary" id="scheduleBtn">Schedule</button>
      </div>
      <div id="residentPicker" class="h2" style="margin-top:10px"></div>
    </section>

    <section class="panel" style="margin-top:12px">
      <h2 class="h1">My Visits</h2>
      <table class="table" id="visitTable">
        <thead><tr><th>Date</th><th>Resident</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    // Auto-fill volunteer ID from saved login
    (function prefillVolunteer(){
      try{
        const u = JSON.parse(localStorage.getItem('currentUser')||'null');
        if(u && u._id){
          $('#volunteerId').value = u._id;
          $('#volIdForSchedule').value = u._id;
        }
      }catch{}
    })();

    async function loadMyVisits(){
      const user = JSON.parse(localStorage.getItem('currentUser')||'null');
      if(!user || user.role !== 'volunteer'){
        toast('Please sign in as a Volunteer to view visits.');
        return;
      }
      const volId = $('#volunteerId').value.trim();
      if(!volId) return toast('Enter your volunteer user ID');
      const list = await api('/api/visits?volunteer='+encodeURIComponent(volId));
      const tbody = $('#visitTable tbody');
      tbody.innerHTML = '';
      list.forEach(v => {
        const tr = document.createElement('tr');
        const d = new Date(v.visitDate);
        tr.innerHTML = `<td>${d.toLocaleString()}</td><td>${v.resident?.name||''}</td><td>${v.status}</td><td>${v.notes||''}</td>
          <td>
            <button class='btn' data-done='${v._id}'>Mark Done</button>
            <button class='btn danger' data-del='${v._id}'>Cancel</button>
            <button class='btn' data-ics='${v._id}'>Download ICS</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    $('#loadVisits').addEventListener('click', loadMyVisits);

    $('#scheduleBtn').addEventListener('click', async ()=>{
      try{
        const user = JSON.parse(localStorage.getItem('currentUser')||'null');
        if(!user || user.role !== 'volunteer'){
          toast('Please sign in as a Volunteer to schedule visits.');
          return;
        }
        const dt = $('#visitDate').value ? new Date($('#visitDate').value).toISOString() : null;
        const payload = { resident: $('#residentId').value.trim(), volunteer: $('#volIdForSchedule').value.trim(), visitDate: dt, notes: $('#visitNotes').value };
        const created = await api('/api/visits', { method:'POST', body: JSON.stringify(payload)});
        toast('Visit scheduled');
        // Offer ICS download for the newly scheduled visit
        try{ if(created && created.visit){ downloadIcs(created.visit); } }catch{}
        loadMyVisits();
      }catch(e){ toast('Schedule failed: '+e.message); }
    });

    // Pick resident helper: fetch and list residents to click-to-fill
    $('#pickResident').addEventListener('click', async ()=>{
      try{
        const list = await api('/api/residents');
        if(!list.length){ $('#residentPicker').textContent = 'No residents found. Add one on Residents page.'; return; }
        const wrap = document.createElement('div');
        wrap.className = 'grid';
        wrap.style.gridTemplateColumns = 'repeat(3,minmax(0,1fr))';
        wrap.style.gap = '8px';
        list.slice(0,9).forEach(r=>{
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<strong>${r.name}</strong><br><span class='h2'>${r.roomNumber||''}</span><br><small>${r._id}</small>`;
          card.style.cursor = 'pointer';
          card.addEventListener('click', ()=>{ $('#residentId').value = r._id; toast('Resident selected'); });
          wrap.appendChild(card);
        });
        const picker = $('#residentPicker');
        picker.innerHTML = '';
        picker.appendChild(wrap);
      }catch(err){ toast('Failed to load residents: '+err.message); }
    });

    function buildIcs(visit){
      const dtStart = new Date(visit.visitDate);
      const dtEnd = new Date(dtStart.getTime()+60*60*1000); // 1 hour default
      const fmt = (d)=> d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
      const uid = `${visit._id || (Date.now()+Math.random())}@careconnect`;
      const summary = `Volunteer Visit${visit.resident?.name? ' - '+visit.resident.name: ''}`;
      const desc = (visit.notes||'') + (visit.resident?.name? `\\nResident: ${visit.resident.name}`:'');
      return [
        'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CareConnect//Visit//EN','CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        `DTSTART:${fmt(dtStart)}`,
        `DTEND:${fmt(dtEnd)}`,
        `DTSTAMP:${fmt(new Date())}`,
        `UID:${uid}`,
        `SUMMARY:${summary}`,
        `DESCRIPTION:${desc}`,
        'END:VEVENT','END:VCALENDAR'
      ].join('\r\n');
    }

    function downloadIcs(visit){
      const ics = buildIcs(visit);
      const blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'visit.ics'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 1000);
    }

    $('#visitTable').addEventListener('click', async (e)=>{
      const doneId = e.target.getAttribute('data-done');
      const delId = e.target.getAttribute('data-del');
      const icsId = e.target.getAttribute('data-ics');
      if(doneId){
        try{ await api('/api/visits/'+doneId, { method:'PUT', body: JSON.stringify({ status:'completed' })}); toast('Marked completed'); loadMyVisits(); }catch(err){ toast('Update failed: '+err.message); }
      } else if(delId){
        if(confirm('Cancel this visit?')){
          try{ await api('/api/visits/'+delId, { method:'DELETE' }); toast('Cancelled'); loadMyVisits(); }catch(err){ toast('Delete failed: '+err.message); }
        }
      } else if(icsId){
        try{
          const list = await api('/api/visits?volunteer='+encodeURIComponent($('#volunteerId').value.trim()));
          const v = list.find(x=> x._id===icsId);
          if(v){ downloadIcs(v); }
        }catch(err){ toast('Could not generate ICS: '+err.message); }
      }
    });
  </script>
</body>
</html>
