<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forum Post</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <nav class="nav between container">
      <div class="nav-left">
        <img class="logo" src="/careconnectlogo.png" alt="CareConnect" />
        <a href="/index.html">Home</a>
        <a href="/forum.html">Forum</a>
      </div>
      <div class="user-dropdown">
        <a class="user-btn" href="#" id="userBtn" title="Account">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </a>
        <div class="menu" id="userMenu">
          <a href="#" id="copyUserId">Copy ID</a>
          <a href="#" id="logoutLink">Logout</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <div id="postContainer">
        <h1 class="h1">Loading post...</h1>
      </div>
    </section>

    <section class="panel" style="margin-top: 20px;">
      <h2 class="h2">Comments</h2>
      
      <!-- Add Comment Form -->
      <div id="commentForm" style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px;">
        <h3 class="h3">Add Comment</h3>
        <textarea class="input" id="commentText" placeholder="Write your comment..." maxlength="1000" rows="3"></textarea>
        <button class="btn primary" id="addCommentBtn" style="margin-top: 10px;">Add Comment</button>
      </div>
      
      <!-- Comments List -->
      <div id="commentsList">
        <p>Loading comments...</p>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let currentUser = null;
    let postId = null;
    let postData = null;

    // Initialize post page
    async function initPostPage() {
      currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
      if (!currentUser) {
        toast('Please login to view posts');
        location.href = '/login.html';
        return;
      }

      // Restrict forum access for volunteers
      if (currentUser.role === 'volunteer') {
        toast('Community Forum is not available for volunteers');
        location.href = '/index.html';
        return;
      }

      // Get post ID from URL
      const urlParams = new URLSearchParams(window.location.search);
      postId = urlParams.get('id');
      
      if (!postId) {
        toast('Post ID not provided');
        location.href = '/forum.html';
        return;
      }

      // Setup user menu
      setupUserMenu();
      
      // Load post and comments
      console.log('🔍 Forum Post Debug - Post ID from URL:', postId);
      console.log('🔍 Forum Post Debug - Current User:', currentUser);
      
      await loadPost();
      await loadComments();
      
      // Setup comment form
      setupCommentForm();
    }

    // Setup user menu
    function setupUserMenu() {
      // User menu setup similar to forum.html
    }

    // Load post
    async function loadPost() {
      try {
        console.log('🔍 Loading post - Calling API with postId:', postId);
        const response = await api('/api/forum/post/' + postId);
        console.log('🔍 Loading post - API response:', response);
        
        if (!response.post) {
          console.log('❌ Loading post - No post in response');
          throw new Error('Post not found in response');
        }
        
        postData = response.post;
        console.log('🔍 Loading post - Post data loaded:', postData);
        console.log('🔍 Loading post - Is Global:', postData.isGlobal);
        console.log('🔍 Loading post - Old Age Home:', postData.oldAgeHome);
        console.log('🔍 Loading post - Created By:', postData.createdBy);
        
        const postContainer = document.getElementById('postContainer');
        
        // Very simple HTML construction
        var postHtml = '<div style="margin-bottom: 20px;">';
        postHtml += '<button class="btn" onclick="history.back()">← Back to Forum</button>';
        
        if (canDeletePost(postData)) {
          postHtml += '<button class="btn danger" onclick="deletePost()" style="margin-left: 10px;">Delete Post</button>';
        }
        
        postHtml += '</div>';
        postHtml += '<h1 class="h1">' + (postData.title || 'Untitled') + '</h1>';
        postHtml += '<div style="color: #666; font-size: 14px; margin-bottom: 20px;">';
        
        // Handle global posts vs regular posts
        if (postData.isGlobal) {
          postHtml += '🌍 Global Announcement';
        } else if (postData.oldAgeHome && postData.oldAgeHome.name) {
          postHtml += 'in ' + postData.oldAgeHome.name;
        } else {
          postHtml += 'in Unknown Home';
        }
        
        postHtml += ' • By ';
        
        // Handle created by safely
        if (postData.createdBy && postData.createdBy.name) {
          postHtml += postData.createdBy.name + ' (' + (postData.createdBy.role || 'Unknown') + ')';
        } else {
          postHtml += 'Unknown (Unknown)';
        }
        
        postHtml += ' • ' + new Date(postData.createdAt).toLocaleDateString();
        postHtml += ' at ' + new Date(postData.createdAt).toLocaleTimeString();
        postHtml += '</div>';
        postHtml += '<div style="font-size: 16px; line-height: 1.6; white-space: pre-wrap;">' + (postData.content || 'No content') + '</div>';
        
        postContainer.innerHTML = postHtml;
        console.log('✅ Post rendered successfully');
      } catch (error) {
        console.error('Failed to load post:', error);
        document.getElementById('postContainer').innerHTML = '<p style="color: red;">Failed to load post</p>';
      }
    }

    // Load comments
    async function loadComments() {
      try {
        console.log('🔍 Loading comments - Calling API with postId:', postId);
        const response = await api('/api/comment/' + postId);
        console.log('🔍 Loading comments - API response:', response);
        
        if (!response.comments) {
          console.log('❌ Loading comments - No comments in response');
          throw new Error('Comments not found in response');
        }
        
        const comments = response.comments;
        console.log('🔍 Loading comments - Comments data loaded:', comments);
        
        const commentsList = document.getElementById('commentsList');
        
        if (comments.length === 0) {
          commentsList.innerHTML = '<p>No comments yet. Be the first to comment!</p>';
        } else {
          var commentsHtml = '';
          for (var i = 0; i < comments.length; i++) {
            var comment = comments[i];
            var userName = (comment.userId && comment.userId.name) || 'Unknown';
            var commentText = comment.commentText || 'No comment text';
            var dateStr = new Date(comment.createdAt).toLocaleDateString();
            var timeStr = new Date(comment.createdAt).toLocaleTimeString();
            var canDelete = canDeleteComment(comment);
            
            commentsHtml += '<div class="panel" style="margin-bottom: 10px; padding: 10px;">';
            commentsHtml += '<div style="color: #666; font-size: 12px; margin-bottom: 5px;">';
            commentsHtml += userName + ' • ' + dateStr + ' at ' + timeStr;
            commentsHtml += '</div>';
            commentsHtml += '<div style="white-space: pre-wrap;">' + commentText + '</div>';
            
            if (canDelete) {
              commentsHtml += '<button class="btn danger" onclick="deleteComment(\'' + comment._id + '\')" style="margin-top: 5px; font-size: 12px;">Delete</button>';
            }
            
            commentsHtml += '</div>';
          }
          
          commentsList.innerHTML = commentsHtml;
        }
        console.log('✅ Comments rendered successfully');
      } catch (error) {
        console.error('Failed to load comments:', error);
        document.getElementById('commentsList').innerHTML = '<p style="color: red;">Failed to load comments</p>';
      }
    }

    // Setup comment form
    function setupCommentForm() {
      const addCommentBtn = document.getElementById('addCommentBtn');
      const commentText = document.getElementById('commentText');
      
      addCommentBtn.addEventListener('click', async () => {
        const text = commentText.value.trim();
        
        console.log('🔍 Adding comment - Text:', text);
        console.log('🔍 Adding comment - Post ID:', postId);
        
        if (!text) {
          toast('Please enter a comment');
          return;
        }
        
        try {
          console.log('🔍 Adding comment - Calling API...');
          const response = await api('/api/comment/add', {
            method: 'POST',
            body: JSON.stringify({ commentText: text, postId })
          });
          
          console.log('🔍 Adding comment - API response:', response);
          toast('Comment added successfully!');
          commentText.value = '';
          await loadComments();
          
        } catch (error) {
          console.log('❌ Adding comment - Error:', error);
          toast('Failed to add comment: ' + error.message);
        }
      });
    }

    // Check if user can delete post
    function canDeletePost(post) {
      if (currentUser.role === 'superadmin') return true;
      if (currentUser.role === 'admin' && post.oldAgeHome && currentUser.homeId && currentUser.homeId.some(h => h._id === post.oldAgeHome._id)) return true;
      return false;
    }

    // Check if user can delete comment
    function canDeleteComment(comment) {
      // User can delete their own comment
      if (comment.userId && comment.userId._id === currentUser._id) return true;
      
      // Admin and Super Admin can delete comments from their home
      if (currentUser.role === 'superadmin') return true;
      if (currentUser.role === 'admin' && postData.oldAgeHome && currentUser.homeId && currentUser.homeId.some(h => h._id === postData.oldAgeHome._id)) return true;
      
      return false;
    }

    // Delete post
    async function deletePost() {
      if (!confirm('Are you sure you want to delete this post and all its comments?')) return;

      try {
        await api(`/api/forum/post/${postId}`, { method: 'DELETE' });
        toast('Post deleted successfully');
        location.href = '/forum.html';
      } catch (error) {
        toast('Failed to delete post: ' + error.message);
      }
    }

    // Delete comment
    async function deleteComment(commentId) {
      if (!confirm('Are you sure you want to delete this comment?')) return;

      try {
        await api(`/api/comment/${commentId}`, { method: 'DELETE' });
        toast('Comment deleted successfully');
        await loadComments();
      } catch (error) {
        toast('Failed to delete comment: ' + error.message);
      }
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', initPostPage);
  </script>
</body>
</html>
