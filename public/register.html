<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header"><nav class="nav container">
    <a href="/index.html">Home</a><a href="/login.html">Login</a><a href="/register.html">Register</a>
  </nav></header>
  <main class="container">
    <section class="panel">
      <h1 class="h1">Register</h1>
      <div class="grid">
        <input class="input" id="name" placeholder="Full name" />
        <input class="input" id="email" placeholder="Email" />
        <input class="input" id="password" type="password" placeholder="Password (min 6)" />
        <button class="btn primary" id="regBtn">Register</button>
      </div>
      <div class="h2" style="margin:14px 0; text-align:center">
        <span class="divider"><span>OR DIRECTLY SIGN UP USING GOOGLE</span></span>
      </div>
      <div style="text-align:center">
        <button class="btn google" id="googleBtn" title="Sign up with Google">
          <svg viewBox="0 0 533.5 544.3" width="18" height="18" style="vertical-align:middle;margin-right:8px"><path fill="#4285f4" d="M533.5 278.4c0-18.5-1.7-36.3-4.9-53.6H272v101.5h146.9c-6.3 34-25 62.8-53.3 82v68h86.1c50.3-46.3 81.8-114.6 81.8-197.9z"/><path fill="#34a853" d="M272 544.3c72.9 0 134.1-24.1 178.8-65.4l-86.1-68c-23.9 16.1-54.5 25.6-92.7 25.6-71 0-131.1-47.9-152.6-112.2H30.5v70.6C74.9 486.1 167.1 544.3 272 544.3z"/><path fill="#fbbc04" d="M119.4 324.3c-10.7-31.9-10.7-66.4 0-98.3V155.4H30.5c-43.1 86.2-43.1 189.4 0 275.6l88.9-70.7z"/><path fill="#ea4335" d="M272 107.7c39.6-.6 77.9 14.4 106.9 41.6l79.9-79.9C405.9 24.3 343 0 272 0 167.1 0 74.9 58.2 30.5 155.4l88.9 70.6C140.9 155.7 201 107.7 272 107.7z"/></svg>
          Continue with Google
        </button>
      </div>
      <div id="result" class="h2"></div>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script type="module">
    import { auth, provider, signInWithPopup } from '/js/firebase-config.js';
    window.googleSignup = async function(){
      try{
        const res = await signInWithPopup(auth, provider);
        const user = res.user;
        const payload = { email: user.email, name: user.displayName };
        const up = await api('/api/auth/google-upsert', { method:'POST', body: JSON.stringify(payload) });
        localStorage.setItem('currentUser', JSON.stringify(up.user));
        toast('Signed up with Google. Redirecting to Home...');
        setTimeout(()=> location.href='/index.html', 600);
      }catch(err){ toast('Google sign-in failed: '+err.message); }
    }
  </script>
  <script>
    $('#regBtn').addEventListener('click', async () => {
      try{
        const payload = { name: $('#name').value, email: $('#email').value, password: $('#password').value };
        const data = await api('/api/auth/register',{ method:'POST', body: JSON.stringify(payload)});
        $('#result').textContent = 'Registered: ' + (data.user?.email || '') + ' | ID: ' + (data.user?._id || '');
        localStorage.setItem('currentUser', JSON.stringify(data.user));
        toast('Registration successful. Logged in as Volunteer.');
        setTimeout(()=> location.href='/volunteer.html', 600);
      }catch(e){ toast('Registration failed: '+e.message); }
    });
    $('#googleBtn').addEventListener('click', ()=>{ window.googleSignup && window.googleSignup(); });
  </script>
</body>
</html>
