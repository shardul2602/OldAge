<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header"><nav class="nav container">
    <a href="/index.html">Home</a><a href="/login.html">Login</a><a href="/register.html">Register</a>
  </nav></header>
  <main class="container">
    <section class="panel">
      <h1 class="h1">Login</h1>
      <div class="grid">
        <input class="input" id="email" placeholder="Email" />
        <input class="input" id="password" type="password" placeholder="Password" />
        <button class="btn primary" id="loginBtn">Login</button>
      </div>
      <div id="result" class="h2"></div>
    </section>
  </main>
  <script src="/js/app.js"></script>
  <script>
    $('#loginBtn').addEventListener('click', async () => {
      try{
        const payload = { email: $('#email').value, password: $('#password').value };
        const data = await api('/api/auth/login',{ method:'POST', body: JSON.stringify(payload)});
        $('#result').textContent = 'Login successful: ' + (data.user?.name || '') + ' | ID: ' + (data.user?._id || '');
        localStorage.setItem('currentUser', JSON.stringify(data.user));
        toast('Logged in. ID saved. Redirecting to Home...');
        setTimeout(()=> location.href='/index.html', 600);
      }catch(e){ toast('Login failed: '+e.message); }
    });
  </script>
</body>
</html>
