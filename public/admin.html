<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <nav class="nav between container">
      <div class="nav-left">
        <img class="logo" src="/careconnectlogo.png" alt="CareConnect" />
        <a href="/index.html">Home</a>
        <a href="/admin.html">Admin Dashboard</a>
        <a href="/residents.html">Resident Management</a>
        <a href="/volunteer.html">Volunteer Dashboard</a>
        <a href="/donations.html">Donations</a>
        <a href="/gallery.html">Gallery</a>
      </div>
      <div class="user-dropdown">
        <a class="user-btn" href="#" id="userBtn" title="Account">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </a>
        <div class="menu" id="userMenu">
          <a href="/login.html">Login</a>
          <a href="/register.html">Register</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    <script>
      // Hide entire page content for volunteers
      try{
        const u = JSON.parse(localStorage.getItem('currentUser')||'null');
        if(u && u.role !== 'admin'){
          document.querySelector('main').style.display = 'none';
          document.body.innerHTML = '<div class="container" style="text-align:center;margin-top:100px"><h1 class="h1">Access Denied</h1><p class="h2">Admins only</p></div>';
        }
      }catch{}
    </script>
    <section class="panel">
      <h1 class="h1">Admin Demo </h1>
      <p class="h2">Quick links</p>
      <ul>
        <li><a href="/residents.html">Manage Residents</a></li>
        <li><a href="/donations.html">Manage Donations</a></li>
      </ul>
    </section>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
