<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resident Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="header">
    <nav class="nav between container">
      <div class="nav-left">
        <img class="logo" src="/careconnectlogo.png" alt="CareConnect" />
        <a href="/index.html">Home</a>
        <a href="/admin.html" id="adminLink">Admin Dashboard</a>
        <a href="/residents.html">Resident Management</a>
        <a href="/volunteer.html">Volunteer Dashboard</a>
        <a href="/donations.html">Donations</a>
        <a href="/gallery.html">Gallery</a>
      </div>
      <div class="user-dropdown">
        <a class="user-btn" href="#" id="userBtn" title="Account">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 12c2.761 0 5-2.239 5-5s-2.239-5-5-5-5 2.239-5 5 2.239 5 5 5Z" stroke="currentColor" stroke-width="1.5"/><path d="M21 22a9 9 0 1 0-18 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </a>
        <div class="menu" id="userMenu">
          <a href="/login.html">Login</a>
          <a href="/register.html">Register</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="container">
    <section class="panel" id="addResidentSection" style="display:none">
      <h1 class="h1">Add Resident</h1>
      <div class="grid cols-2">
        <input class="input" id="r_name" placeholder="Name" />
        <input class="input" id="r_age" type="number" placeholder="Age" />
        <select class="input" id="r_gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <select class="input" id="r_blood">
          <option value="O+">O+</option>
          <option value="O-">O-</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
        </select>
        <input class="input" id="r_admission" type="date" placeholder="Admission Date" />
        <input class="input" id="r_room" placeholder="Room Number" />
        <input class="input" id="r_ec_name" placeholder="Emergency Contact Name" />
        <input class="input" id="r_ec_phone" placeholder="Emergency Contact Phone" />
        <input class="input" id="r_health" placeholder="Health Conditions" />
        <textarea class="input" id="r_history" placeholder="Medical History" rows="3"></textarea>
        <button class="btn primary" id="r_add">Add Resident</button>
      </div>
    </section>

    <script>
      // Show Add Resident only for admins
      try{
        const u = JSON.parse(localStorage.getItem('currentUser')||'null');
        if(u && u.role === 'admin'){
          document.getElementById('addResidentSection').style.display = 'block';
        }
        // Hide Admin Dashboard link for volunteers
        const adminLink = document.getElementById('adminLink');
        if(adminLink && (!u || u.role !== 'admin')){
          adminLink.style.display = 'none';
        }
      }catch{}
    </script>

    <section class="panel" style="margin-top:12px">
      <h2 class="h1">Residents</h2>
      <table class="table" id="resTable">
        <thead><tr><th>Name</th><th>Age</th><th>Gender</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/js/app.js?t=789"></script>
  <script>
    async function loadResidents(){
      const data = await api('/api/residents');
      const tbody = $('#resTable tbody');
      tbody.innerHTML = '';
      const isAdmin = (() => {
        try { const u = JSON.parse(localStorage.getItem('currentUser')||'null'); return u && u.role === 'admin'; } catch { return false; }
      })();
      data.forEach(r => {
        const tr = document.createElement('tr');
        const adm = r.admissionDate ? new Date(r.admissionDate).toLocaleDateString() : '';
        const actions = isAdmin
          ? `<button class="btn" data-view="${r._id}">View Profile</button><button class="btn" data-edit="${r._id}">Edit Room</button><button class="btn danger" data-del="${r._id}">Delete</button>`
          : `<button class="btn" data-view="${r._id}">View Profile</button>`;
        tr.innerHTML = `<td>${r.name}</td><td>${r.age||''}</td><td>${r.gender||''}</td><td>${actions}</td>`;
        tbody.appendChild(tr);
      });
    }

    $('#r_add').addEventListener('click', async ()=>{
      try{
        const payload = {
          name: $('#r_name').value,
          age: Number($('#r_age').value||0),
          gender: $('#r_gender').value,
          bloodGroup: $('#r_blood').value,
          medicalHistory: $('#r_history').value,
          admissionDate: $('#r_admission').value ? new Date($('#r_admission').value).toISOString() : undefined,
          roomNumber: $('#r_room').value,
          healthConditions: $('#r_health').value,
          emergencyContact: { name: $('#r_ec_name').value, phone: $('#r_ec_phone').value }
        };
        await api('/api/residents',{ method:'POST', body: JSON.stringify(payload)});
        toast('Resident added');
        loadResidents();
      }catch(e){ toast('Add failed: '+e.message); }
    });

    $('#resTable').addEventListener('click', async (e)=>{
      const idDel = e.target.getAttribute('data-del');
      const idEdit = e.target.getAttribute('data-edit');
      const idView = e.target.getAttribute('data-view');
      if(idDel){
        if(confirm('Delete this resident?')){
          try{ await api('/api/residents/'+idDel,{ method:'DELETE'}); toast('Deleted'); loadResidents(); }catch(err){ toast('Delete failed: '+err.message); }
        }
      } else if(idEdit){
        const room = prompt('New Room Number:');
        if(room!=null){
          try{ await api('/api/residents/'+idEdit,{ method:'PUT', body: JSON.stringify({ roomNumber: room })}); toast('Updated'); loadResidents(); }catch(err){ toast('Update failed: '+err.message); }
        }
      } else if(idView){
        try{
          const r = await api('/api/residents/'+idView);
          const adm = r.admissionDate ? new Date(r.admissionDate).toLocaleDateString() : '';
          const popup = document.createElement('div');
          popup.className = 'modal-overlay';
          popup.innerHTML = `
            <div class="modal">
              <h2 class="h2">Resident Profile</h2>
              <p><strong>Name:</strong> ${r.name}</p>
              <p><strong>Age:</strong> ${r.age||''}</p>
              <p><strong>Gender:</strong> ${r.gender||''}</p>
              <p><strong>Blood Group:</strong> ${r.bloodGroup||''}</p>
              <p><strong>Admission Date:</strong> ${adm}</p>
              <p><strong>Room:</strong> ${r.roomNumber||''}</p>
              <p><strong>Health Conditions:</strong> ${r.healthConditions||''}</p>
              <p><strong>Medical History:</strong> ${r.medicalHistory||''}</p>
              <p><strong>Emergency Contact:</strong> ${r.emergencyContact?.name||''} (${r.emergencyContact?.phone||''})</p>
              <button class="btn primary" onclick="this.closest('.modal-overlay').remove()">Close</button>
            </div>
          `;
          document.body.appendChild(popup);
        }catch(err){ toast('Failed to load profile: '+err.message); }
      }
    });

    loadResidents();
  </script>
</body>
</html>
